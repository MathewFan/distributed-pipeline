services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    entrypoint: []
    command:
      - rpk
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
  clickhouse:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || curl -fsS http://localhost:8123/ping || exit 1"]
      interval: 2s
      timeout: 1s
      retries: 60

  processor:
    depends_on:
      clickhouse:
        condition: service_healthy
    command:
      - sh
      - -lc
      - |
          python - <<'PY'
          import time, urllib.request
          url = "http://clickhouse:8123/ping"
          for i in range(120):
              try:
                  with urllib.request.urlopen(url, timeout=1) as r:
                      if r.read().startswith(b"Ok"):
                          break
              except Exception:
                  pass
              print("waiting for clickhouse...")
              time.sleep(1)
          else:
              raise SystemExit("ClickHouse not ready")
          PY
          faust -A main worker -l info
    restart: on-failure