services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    command: [redpanda, start, --overprovisioned, --smp, "1", --memory, 512M, --reserve-memory, 0M, --kafka-addr, "0.0.0.0:9092", --advertise-kafka-addr, "redpanda:9092"]
    healthcheck:
      test: [CMD, rpk, cluster, health]
      interval: 5s
      timeout: 5s
      retries: 30
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: local-demo-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: [CMD, wget, --spider, -q, "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  producer:
    build:
      context: .
      dockerfile: services/producer/Dockerfile
    environment:
      BROKER: redpanda:9092
      TOPIC: transactions
      RATE_PER_SEC: "200"
    depends_on:
      redpanda: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    environment:
      BROKER: redpanda:9092
      TOPIC: transactions
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: pipeline
      CLICKHOUSE_PASSWORD: local-demo-only
    depends_on:
      redpanda: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    ports: ["127.0.0.1:9101:9101"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
